<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::section}, 'khachhang')}">
<head><title>Khách hàng — BShoes</title></head>
<body>
<section>
    <div id="app">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0">Khách hàng</h4>
            <button class="btn text-white" style="background:var(--bs-green)" @click="moThem">+ Thêm khách hàng</button>
        </div>
        <input class="form-control mb-3" style="max-width:320px" v-model="tuKhoa" placeholder="Tìm theo mã / tên / SĐT...">
        <table class="table table-hover bg-white align-middle">
            <thead><tr>
                <th>Mã KH</th><th>Tên</th><th>Giới tính</th><th>SĐT</th><th>Email</th><th>Địa chỉ</th><th>Trạng thái</th><th></th>
            </tr></thead>
            <tbody>
                <tr v-for="p in ketQua" :key="p.id">
                    <td>{{ p.ma }}</td><td>{{ p.ten }}</td><td>{{ p.gioiTinh }}</td><td>{{ p.sdt }}</td>
                    <td>{{ p.email }}</td><td>{{ p.diaChi }}</td>
                    <td><span class="badge" :class="p.trangThai ? 'bg-success' : 'bg-secondary'">{{ p.trangThai ? 'Hoạt động' : 'Ngừng' }}</span></td>
                    <td class="text-end">
                        <button class="btn btn-sm btn-outline-secondary" @click="moSua(p)">Sửa</button>
                        <button class="btn btn-sm btn-outline-danger" @click="xoa(p)">Xoá</button>
                    </td>
                </tr>
                <tr v-if="ketQua.length === 0"><td colspan="8" class="text-center text-muted">Không có dữ liệu</td></tr>
            </tbody>
        </table>

        <div class="modal fade" ref="modalEl" tabindex="-1">
            <div class="modal-dialog"><div class="modal-content">
                <div class="modal-header"><h5 class="modal-title">{{ form.id ? 'Sửa' : 'Thêm' }} khách hàng</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <div class="mb-2"><label class="form-label">Tên</label><input class="form-control" v-model="form.ten"></div>
                    <div class="mb-2"><label class="form-label">Giới tính</label>
                        <select class="form-select" v-model="form.gioiTinh"><option>Nam</option><option>Nữ</option></select></div>
                    <div class="mb-2"><label class="form-label">Số điện thoại</label><input class="form-control" v-model="form.sdt"></div>
                    <div class="mb-2"><label class="form-label">Email</label><input type="email" class="form-control" v-model="form.email"></div>
                    <div class="mb-2"><label class="form-label">Địa chỉ</label><input class="form-control" v-model="form.diaChi"></div>
                    <div class="form-check"><input class="form-check-input" type="checkbox" v-model="form.trangThai" id="tt"><label class="form-check-label" for="tt">Hoạt động</label></div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Huỷ</button>
                    <button class="btn text-white" style="background:var(--bs-green)" @click="luu">Lưu</button>
                </div>
            </div></div>
        </div>
    </div>
</section>
<script>
Vue.createApp({
    data() { return {
        tuKhoa: '', modal: null, seq: 3,
        form: { id: null, ma: '', ten: '', gioiTinh: 'Nam', sdt: '', email: '', diaChi: '', trangThai: true },
        rows: [
            { id:1, ma:'KH1', ten:'Nguyễn Văn A', gioiTinh:'Nam', sdt:'0901111111', email:'a@gmail.com', diaChi:'Hà Nội', trangThai:true },
            { id:2, ma:'KH2', ten:'Trần Thị B', gioiTinh:'Nữ', sdt:'0902222222', email:'b@gmail.com', diaChi:'Đà Nẵng', trangThai:true },
            { id:3, ma:'KH3', ten:'Lê Văn C', gioiTinh:'Nam', sdt:'0903333333', email:'c@gmail.com', diaChi:'TP.HCM', trangThai:false },
        ]
    }; },
    computed: {
        ketQua() { const k = this.tuKhoa.toLowerCase();
            return this.rows.filter(r => r.ma.toLowerCase().includes(k) || r.ten.toLowerCase().includes(k) || r.sdt.includes(k)); }
    },
    mounted() { this.modal = new bootstrap.Modal(this.$refs.modalEl); },
    methods: {
        moThem() { this.form = { id:null, ma:'', ten:'', gioiTinh:'Nam', sdt:'', email:'', diaChi:'', trangThai:true }; this.modal.show(); },
        moSua(p) { this.form = JSON.parse(JSON.stringify(p)); this.modal.show(); },
        luu() {
            if (this.form.id) { const i = this.rows.findIndex(r => r.id === this.form.id); this.rows.splice(i, 1, this.form); }
            else { this.form.id = ++this.seq; this.form.ma = 'KH' + this.form.id; this.rows.push(this.form); }
            this.modal.hide();
        },
        xoa(p) { if (confirm('Xoá khách hàng ' + p.ma + '?')) this.rows = this.rows.filter(r => r.id !== p.id); }
    }
}).mount('#app');
</script>
</body>
</html>
