spring.application.name=bshoes
server.port=8085

# Thymeleaf
spring.thymeleaf.cache=false

# SQL Server datasource (matches legacy util/XJdbc target). App will not start until
# entities are JPA-annotated and this DB is reachable. Adjust credentials as needed.
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=BShoes;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# KEEP THIS PINNED. It logs a cosmetic HHH90000025 "does not need to be specified"
# warning on startup, and removing it for that reason was a mistake: without the
# pin Hibernate has to read the dialect from JDBC metadata, so with SQL Server
# unreachable the whole app dies at boot with
#   HibernateException: Unable to determine Dialect without JDBC metadata
# instead of starting degraded. A noisy log line beats an app that will not start.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# NOTE: open-in-view=false means any lazy association must be fetch-joined in the
# repository query — see NhanVienRepository.findActive().

# Local image upload (product variant images)
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB
app.upload.dir=uploads
