# LƯU Ý: file này THAY THẾ hoàn toàn src/main/resources/application.properties khi chạy
# test (cùng tên thì bản trong test classpath thắng, không hợp nhất) — nên phải khai lại
# cả datasource, thiếu là "Failed to determine a suitable driver class".
spring.application.name=bshoes

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=BShoes;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Chưa có SQL Server nên contextLoads sẽ chết ngay ở bước tạo pool.
# initialization-fail-timeout=-1 cho Hikari lùi việc kết nối sang lúc dùng thật, nhờ đó
# context vẫn dựng được và ta vẫn kiểm tra được toàn bộ wiring: entity, repository
# (JPQL parse lúc khởi động), service, controller mapping.
#
# Đây KHÔNG phải test tích hợp — không câu lệnh SQL nào chạy. Test cần dữ liệu thật
# vẫn phải có DB.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=3000

# Dialect tường minh để Hibernate khỏi dò metadata qua JDBC lúc khởi động.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
